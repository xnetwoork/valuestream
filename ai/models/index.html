<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Registry — ValueStreamHub AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/ai/assets/css/ai-core.css">
    <script src="/ai/assets/js/model-registry.js"></script>
    <script src="/ai/assets/js/ai-nav.js" defer></script>
</head>
<body class="vsh-ai-theme bg-[#040711] text-slate-100 min-h-screen flex flex-col antialiased">
    <div id="vsh-ai-header"></div>

    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <!-- Title Header -->
        <div class="text-center max-w-3xl mx-auto mb-12">
            <span class="text-xs font-mono uppercase tracking-widest text-cyan-400 bg-cyan-500/10 px-3 py-1 rounded border border-cyan-500/20">CENTRAL MODEL REGISTRY</span>
            <h1 class="text-4xl sm:text-6xl font-extrabold font-display text-white mt-4 mb-4">
                EXPLORE ALL LIVE AI MODELS
            </h1>
            <p class="text-slate-400 text-sm sm:text-base">
                Dynamically managed registry. All models below are verified LIVE with active API provider adapters.
            </p>
        </div>

        <!-- Filter Tabs -->
        <div class="flex flex-wrap items-center justify-center gap-2 mb-10 font-mono text-xs" id="vsh-model-filter-tabs">
            <button onclick="filterModels('ALL')" class="px-3 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 font-bold active">ALL MODELS</button>
            <button onclick="filterModels('LIVE')" class="px-3 py-1.5 rounded-lg bg-white/5 text-slate-300 hover:bg-white/10">LIVE ONLY</button>
            <button onclick="filterModels('Reasoning')" class="px-3 py-1.5 rounded-lg bg-white/5 text-slate-300 hover:bg-white/10">REASONING</button>
            <button onclick="filterModels('Code')" class="px-3 py-1.5 rounded-lg bg-white/5 text-slate-300 hover:bg-white/10">CODING</button>
            <button onclick="filterModels('Research')" class="px-3 py-1.5 rounded-lg bg-white/5 text-slate-300 hover:bg-white/10">RESEARCH & WEB</button>
            <button onclick="filterModels('image-gen')" class="px-3 py-1.5 rounded-lg bg-white/5 text-slate-300 hover:bg-white/10">IMAGE ENGINES</button>
            <button onclick="filterModels('video-gen')" class="px-3 py-1.5 rounded-lg bg-white/5 text-slate-300 hover:bg-white/10">VIDEO ENGINES</button>
        </div>

        <!-- Models Grid -->
        <div id="vsh-registry-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Populated via JS -->
        </div>
    </main>

    <div id="vsh-ai-footer"></div>

    <script>
        let currentFilter = 'ALL';

        document.addEventListener('DOMContentLoaded', () => {
            renderRegistryGrid();
        });

        function filterModels(category) {
            currentFilter = category;
            document.querySelectorAll('#vsh-model-filter-tabs button').forEach(btn => {
                btn.classList.remove('bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/40', 'font-bold');
                btn.classList.add('bg-white/5', 'text-slate-300');
            });
            event.target.classList.add('bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/40', 'font-bold');
            renderRegistryGrid();
        }

        function renderRegistryGrid() {
            const grid = document.getElementById('vsh-registry-grid');
            if (!grid || typeof MODEL_REGISTRY === 'undefined') return;

            let filtered = MODEL_REGISTRY;
            if (currentFilter === 'LIVE') {
                filtered = MODEL_REGISTRY.filter(m => m.availability === 'LIVE');
            } else if (currentFilter === 'Reasoning') {
                filtered = MODEL_REGISTRY.filter(m => m.reasoningLevel === 'Max' || m.reasoningLevel === 'Ultra');
            } else if (currentFilter === 'Code') {
                filtered = MODEL_REGISTRY.filter(m => m.capabilities.includes('Code') || m.modality === 'code');
            } else if (currentFilter === 'Research') {
                filtered = MODEL_REGISTRY.filter(m => m.supportsWeb || m.capabilities.includes('Web Search'));
            } else if (currentFilter === 'image-gen') {
                filtered = MODEL_REGISTRY.filter(m => m.modality === 'image-gen');
            } else if (currentFilter === 'video-gen') {
                filtered = MODEL_REGISTRY.filter(m => m.modality === 'video-gen');
            }

            grid.innerHTML = filtered.map(m => `
                <div class="vsh-glass-card p-6 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-2">
                                <img src="${m.icon}" class="w-5 h-5 ${m.provider === 'OpenAI' || m.provider === 'Anthropic' || m.provider === 'xAI' ? 'invert' : ''}" alt="${m.provider}">
                                <span class="text-xs font-mono font-bold text-white">${m.provider}</span>
                            </div>
                            <span class="${m.availability === 'LIVE' ? 'vsh-badge-live' : (m.availability === 'BETA' ? 'vsh-badge-beta' : 'vsh-badge-coming-soon')}">${m.availability}</span>
                        </div>
                        <h3 class="text-xl font-bold font-display text-white mb-1">${m.displayName}</h3>
                        <p class="text-[11px] font-mono text-cyan-400 mb-3">ID: ${m.id} • ${m.latencyTier}</p>
                        <p class="text-xs text-slate-300 mb-4 leading-relaxed">${m.description}</p>
                    </div>

                    <div>
                        <div class="flex flex-wrap gap-1.5 mb-4">
                            ${m.capabilities.map(c => `<span class="px-2 py-0.5 rounded text-[10px] font-mono bg-white/5 text-slate-300 border border-white/10">${c}</span>`).join('')}
                        </div>
                        <div class="flex items-center justify-between text-[11px] font-mono text-slate-400 pt-3 border-t border-white/10">
                            <span>Context: ${m.contextWindow ? (m.contextWindow / 1000) + 'k tokens' : 'N/A'}</span>
                            ${m.availability === 'LIVE' ? `<a href="/ai/chat?model=${m.id}" class="text-cyan-400 font-bold hover:underline">Use Model →</a>` : `<span class="text-slate-500">Coming Soon</span>`}
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
